[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cint-mcp"
version = "0.2.0"
description = "Model Context Protocol (MCP) server for cint 0.2.0 specifications, diagnostics, recipes, and execution"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0 WITH LLVM-exception" }
authors = [
    { name = "cint authors" }
]
keywords = ["cint", "mcp", "ai-agents", "claude-code", "language-server", "model-context-protocol"]

[project.scripts]
cint-mcp = "cint_mcp_server:main"

[tool.setuptools]
py-modules = ["cint_mcp_server"]
data-files = { "" = ["corpus.json", ".mcp.json"] }
